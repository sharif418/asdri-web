name: asdri-dev

# Local services for development. The app itself runs on the host with `bun run dev`.
# Object storage is any S3-compatible server; we use RustFS (MinIO-compatible API + console)
# because MinIO no longer publishes public container images. See docs/adr/0004-object-storage.md.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asdri
    ports:
      - '5432:5432'
    volumes:
      - pg-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - s3-dev:/data

volumes:
  pg-dev:
  s3-dev:
